# The main comparison repeated with a fixed number of nodes / simulations per move,
# to check that conclusions do not depend on machine-load noise.
# mcts_ab / mcts_ab_tac are left out on purpose: one "simulation" of an AB-leaf hybrid
# is a whole depth-2 alpha-beta search (~100-200 sims/s), so a node budget is neither
# comparable nor affordable for them (10,000 sims ~ 50 s per move; 80 h -> 17 h without).
name: nodes_budget
seed: 20260305
boards: [[7, 4], [9, 5]]
budget_mode: nodes
budgets: [2000, 10000]          # nodes (alpha-beta) or simulations (MCTS) per move
skip_cells: ["9x5@10000"]       # ~11 h; 9x5@2000 and both 7x4 cells are enough for the check
games_per_pair: 100
anchor: random
agents:
  - random
  - backtracking_d2
  - ab_plain
  - ab_order
  - ab_order_id_tt
  - ab_full
  - ab_full_timed
  - mcts_random
  - mcts_heuristic
  - mcts_rave
  - mcts_eval
  - mcts_heuristic_tac
  - mcts_rave_tac
  - mcts_eval_tac
