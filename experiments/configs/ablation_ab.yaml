# Alpha-beta ablation: node counts at fixed depth, nodes-vs-depth growth, and a
# tournament between the presets.
name: ablation_ab
seed: 20260302
boards: [[9, 5]]
budget_mode: time
budgets: [0.5]
games_per_pair: 40
anchor: random
agents:
  - random
  - ab_plain
  - ab_order
  - ab_order_id
  - ab_order_id_tt
  - ab_full
  - ab_full_timed
depth_table:
  depth: 4                      # AB presets on the three fixed 9x9 midgames
depth_scaling:
  n: 7
  k: 4
  depths: [1, 2, 3, 4, 5, 6]
  cap_s: 60                     # stop an agent at the first depth exceeding this
  agents: [backtracking, ab_plain, ab_order, ab_order_id_tt, ab_full]
quick:
  depth_table: {depth: 3}
  depth_scaling: {depths: [1, 2, 3, 4], cap_s: 10}
